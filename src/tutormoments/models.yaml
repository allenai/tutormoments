# Model registry: stable per-model facts.
#
# One entry per model. The key is matched against configured model ids
# case-insensitively, exact id first, then longest matching prefix (so
# `claude-haiku-4-5-20251001` resolves to the `claude-haiku-4-5` entry).
# Each entry states:
#
#   provider: which API client and key the model routes to (unlisted models
#     fall back to the prefix table in models.py).
#   max_output_cap: per-model output token ceiling (requests above it are
#     rejected by the API); omit when the provider default rules.
#   pricing: per-MTok token costs; empty means "not priced yet", never
#     "free". A populated entry states list rates in $/MTok for the four
#     canonical usage buckets -- input (uncached), output (reasoning tokens
#     bill at this rate everywhere), cache_read, cache_write (0 where the
#     provider meters no write premium) -- plus batch_multiplier (the batch
#     API discount; 1.0 where none applies or none is used), as_of (the date
#     the rates were read from the provider's documentation -- rates change
#     over time, so costs are only meaningful alongside this date), and
#     source (the documentation URL the rates came from).
#
#     When a provider offers multiple cache-write rates by TTL (Anthropic:
#     1.25x input for the 5-minute cache, 2x for the 1-hour cache), state the
#     rate for the TTL the runtime actually requests. The client only ever
#     sends bare `cache_control: {type: ephemeral}` -- the 5-minute default --
#     so Anthropic entries carry the 1.25x rate. Usage reports don't say
#     which TTL a cache write used, so if the runtime ever opts into 1h
#     caching this single-rate scheme must be revisited, not just repriced.
#
# Reasoning conditions do NOT live here: every configured arm and role states
# its provider-native thinking parameters in the config YAML itself, so a
# reviewer can read what was sent without consulting a mapping. See
# docs/thinking.md.

# Bumped whenever any pricing entry changes; run summaries record it so a
# published cost stays interpretable after later rate updates.
pricing_version: "2026-09-16"

models:
  # --- Anthropic ---
  claude-opus-4-6:
    provider: anthropic
    pricing:
      input: 5.00
      output: 25.00
      cache_read: 0.50
      cache_write: 6.25
      batch_multiplier: 0.5
      as_of: "2026-09-16"
      source: https://platform.claude.com/docs/en/about-claude/pricing
  claude-sonnet-4-6:
    provider: anthropic
    pricing:
      input: 3.00
      output: 15.00
      cache_read: 0.30
      cache_write: 3.75
      batch_multiplier: 0.5
      as_of: "2026-09-16"
      source: https://platform.claude.com/docs/en/about-claude/pricing
  claude-opus-4-7:
    provider: anthropic
    pricing: {}
  claude-opus-4-8:
    provider: anthropic
    pricing:
      input: 5.00
      output: 25.00
      cache_read: 0.50
      cache_write: 6.25
      batch_multiplier: 0.5
      as_of: "2026-09-16"
      source: https://platform.claude.com/docs/en/about-claude/pricing
  claude-sonnet-5:
    provider: anthropic
    pricing: {}
  claude-3-7-sonnet:
    provider: anthropic
    pricing: {}
  claude-haiku-4-5:
    provider: anthropic
    # Verified against the Models API (client.models.retrieve(id).max_tokens)
    # on 2026-08-17; re-check there rather than trusting this value if the
    # model 400s on max_tokens.
    max_output_cap: 64000
    pricing: {}
  claude-opus-4-0:
    provider: anthropic
    pricing: {}
  claude-opus-4-20250514:
    provider: anthropic
    pricing: {}
  claude-opus-4-1:
    provider: anthropic
    pricing: {}
  claude-opus-4-5:
    provider: anthropic
    pricing: {}
  claude-sonnet-4-0:
    provider: anthropic
    pricing: {}
  claude-sonnet-4-20250514:
    provider: anthropic
    pricing: {}
  claude-sonnet-4-5:
    provider: anthropic
    pricing: {}

  # --- Gemini ---
  # Gemini bills thinking tokens at the output rate (the pricing page's
  # output price "includes thinking tokens"), matching how costing folds the
  # canonical `reasoning` bucket into output. No metered cache-write premium
  # (implicit caching; explicit-cache storage is per-token-hour and unused
  # here, so cache_write stays 0).
  gemini-2.5-pro:
    provider: gemini
    # <=200k-token-prompt tier; prompts >200k bill 2x input / 1.5x output.
    # Benchmark prompts are far below the threshold (whole runs total well
    # under 200k input), so the base tier is the correct rate.
    pricing:
      input: 1.25
      output: 10.00
      cache_read: 0.125
      cache_write: 0
      batch_multiplier: 0.5
      as_of: "2026-09-16"
      source: https://ai.google.dev/gemini-api/docs/pricing
  gemini-2.5-flash:
    provider: gemini
    pricing: {}
  gemini-3.5-flash:
    provider: gemini
    pricing:
      input: 1.50
      output: 9.00
      cache_read: 0.15
      cache_write: 0
      batch_multiplier: 0.5
      as_of: "2026-09-16"
      source: https://ai.google.dev/gemini-api/docs/pricing

  # --- OpenAI ---
  # OpenAI meters no cache-write premium on the GPT-5.4/5.5 generation
  # (cache_write_tokens first appears on GPT-5.6-gen models at 1.25x input),
  # so cache_write is 0 here. Cached-input pricing applies on the Batch API
  # per the pricing page, though our capture layer zeroes cache_read on
  # OpenAI batch usage (we never batch OpenAI in runtime runs).
  gpt-5.4-mini:
    provider: openai
    pricing:
      input: 0.75
      output: 4.50
      cache_read: 0.075
      cache_write: 0
      batch_multiplier: 0.5
      as_of: "2026-09-16"
      source: https://developers.openai.com/api/docs/pricing
  gpt-5.5:
    provider: openai
    # <=272k-input tier; larger prompts bill 2x input / 1.5x output for the
    # full session. Benchmark prompts are far below the threshold.
    pricing:
      input: 5.00
      output: 30.00
      cache_read: 0.50
      cache_write: 0
      batch_multiplier: 0.5
      as_of: "2026-09-16"
      source: https://developers.openai.com/api/docs/pricing
  o1:
    provider: openai
    pricing: {}
  o3:
    provider: openai
    pricing: {}
  o4:
    provider: openai
    pricing: {}

  # --- Together (open-weight) ---
  deepseek-ai/DeepSeek-V4-Pro:
    provider: together
    # batch_multiplier is 1.0: Together's pricing page lists no batch rate
    # for this model.
    pricing:
      input: 1.32
      output: 3.96
      cache_read: 0.13
      cache_write: 0
      batch_multiplier: 1.0
      as_of: "2026-09-16"
      source: https://www.together.ai/pricing
