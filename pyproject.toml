[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tutormoments"
version = "0.1.0"
description = "A benchmark for measuring how well language models tutor."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Allen Institute for Artificial Intelligence" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # >=0.72 exposes output_config as a top-level message param; the batch path
    # (client._run_batch_anthropic) sets params["output_config"] directly, so an
    # older SDK would strip effort and silently diverge from the sync path.
    "anthropic>=0.72",
    "openai",
    "google-genai",
    "pyyaml",
    "python-dotenv",
    "datasets",
]

[project.optional-dependencies]
# maintainer-only dataset construction / release tooling
build = ["boto3", "jsonschema"]
# analysis / figures layer: pandas for taxonomy headline tables, matplotlib/seaborn
# for the notebooks + benchmark_perf_cost.py (was misnamed "taxonomy")
analysis = ["pandas", "matplotlib", "seaborn"]
# dev alone runs the runtime tests; add build-dev (+analysis) for the full suite
dev = ["pytest", "ruff"]
build-dev = ["tutormoments[build]", "moto[s3]"]

[project.scripts]
tutormoments = "tutormoments.cli:main"
tutormoments-build = "tutormoments_build.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tutormoments*", "tutormoments_build*", "analysis*"]

[tool.setuptools.package-data]
tutormoments = [
    "default_config.yaml",
    "models.yaml",
    "latency_probe_ids.json",
    "prompts/tutor/*.txt",
    "prompts/student/*.txt",
    "prompts/scorer/annotate/*.md",
    "prompts/scorer/decompose/*.md",
    "prompts/scorer/structure/*.md",
    "prompts/taxonomy/*.md",
    "prompts/smoke/*.md",
]
tutormoments_build = [
    "moments.schema.json",
    "prompts/classify/labeller/*.txt",
    "prompts/classify/situation_labeller/*.md",
    "prompts/trait_generator/*.txt",
    "prompts/trait_generator/dimensions/*.txt",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Research notebooks are exploratory artifacts; don't lint/format them. Markdown
# is docs prose (ruff would otherwise reformat Python code fences in README.md).
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
# Ruff's default E subset (E4 imports, E7 statements, E9 syntax) + pyflakes (F)
# + import sorting (I). Whitespace/line-length rules (E1/E2/E3, E501) are left to
# `ruff format`, so long lines don't fail `ruff check`.
select = ["E4", "E7", "E9", "F", "I"]
# E402: cli.py intentionally re-exports imports after a function definition so
# tests can monkeypatch them. E741: `l` is used as a throwaway in a few tests.
# Both are stylistic here, so we don't gate on them.
ignore = ["E402", "E741"]
